name: tests

# Runs the full pytest suite on every push and pull request. The production
# release script (scripts/production_release.py) only uploads reviewed commits,
# and this workflow is what makes "reviewed" mean "green" without a local run.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run test suite
        run: python -m pytest tests -q -p no:cacheprovider

  dependency-audit:
    # Отдельная задача: она сообщает об уязвимых зависимостях, но не заменяет
    # прогон тестов. Нужна потому, что раньше уязвимый streamlink дожил до
    # основной ветки незамеченным.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Audit pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt --strict
